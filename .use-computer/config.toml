# use-computer's own project config. Discovered by walking up from the current
# directory, so it works from anywhere in this repository.
#
# Secrets (VNC passwords) go in .use-computer/.env, which is gitignored.
# `use-computer config show` prints every resolved value and where it came from.

default-profile = "local"

# Seconds to wait after each action, so the application can react.
delay = 0.1

[profiles.local]
backend = "local"
# The local backend moves THIS machine's pointer and types on THIS machine's
# keyboard. That is why it is off by default; this line is the explicit opt-in.
allow-local = true

# [profiles.staging]
# backend = "vnc"
# host = "10.0.0.5"
# port = 5900
# The password belongs in .use-computer/.env, not here:
#   USE_COMPUTER_PROFILES__STAGING__PASSWORD=...
