name: CI

# Everyday testing. Publishing lives in publish.yml, so neither workflow shares
# its identity with the other.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The package lives under code/ in this SDD repository. GitHub only reads
# workflows from the repository root, so they live here and every step runs
# in code/.
defaults:
  run:
    working-directory: code

env:
  # rich enables colour inside GitHub Actions, and its highlighter splits an
  # option token across styled spans -- so substring assertions pass locally
  # and fail here.
  TERM: dumb
  COLUMNS: "200"
  NO_COLOR: "1"

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.typer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported typer range. The floor is the version
        # actually tested: a floor nobody runs is a floor nobody can trust.
        # typer 0.27 stopped being click-based, which a single "latest" job
        # would have caught only by accident.
        include:
          - python: "3.10"
            typer: "typer==0.16.0"
          - python: "3.12"
            typer: "typer==0.16.0"
          - python: "3.12"
            typer: "typer"
    steps:
      # Majors checked against the current releases, not copied from an older
      # workflow.
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact version, not a major alias: astral-sh/setup-uv stops publishing
        # the vN tags after v7, so `@v10` does not resolve even though v10.0.1
        # is the current release.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}

      # uv.lock is not committed, so this resolves the way a user installing
      # from PyPI does.
      - name: Install the project
        run: |
          uv sync --extra dev --extra local --extra vnc
          uv pip install '${{ matrix.typer }}'

      - name: Report the resolved versions
        run: |
          uv run --no-sync python -c "import typer, rich, pydantic; print('typer', typer.__version__, '| rich', rich.__version__, '| pydantic', pydantic.VERSION)"

      # Cold cache on purpose: a warm one once reported a clean tree while a
      # real error sat in a file it had already seen.
      - name: Lint
        run: uv run --no-sync ruff check --no-cache .

      - name: Type-check
        run: uv run --no-sync mypy

      - name: Test
        run: uv run --no-sync pytest -q

  bare:
    name: the CLI works with no extras installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      # Backends are optional extras imported lazily. If an import ever escapes
      # to module scope, the package stops installing for everyone who does not
      # want a backend -- and nothing else in the suite would notice.
      - name: Install without extras
        run: uv pip install --system .

      - name: Run it
        run: |
          use-computer --version
          use-computer --help
          use-computer config init --backend vnc --host 127.0.0.1 --dir "$RUNNER_TEMP" --no-probe
